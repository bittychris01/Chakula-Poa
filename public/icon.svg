<svg width="180" height="180" viewBox="0 0 180 180" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#121212"/>
    </linearGradient>

    <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="180" height="180" rx="32" fill="url(#bgGrad)"/>

  <!-- Steam -->
  <path d="M78 42 C72 34, 72 28, 78 22" stroke="#FFA726" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M90 42 C84 34, 84 28, 90 22" stroke="#FFA726" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M102 42 C96 34, 96 28, 102 22" stroke="#FFA726" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Bowl -->
  <path d="M50 90 H130 C126 118, 54 118, 50 90 Z" fill="url(#bowlGrad)"/>
  <ellipse cx="90" cy="90" rx="40" ry="6" fill="#FFB74D"/>

  <!-- Bowl base -->
  <rect x="76" y="118" width="28" height="8" rx="4" fill="#FB8C00"/>

  <!-- Checkmark -->
  <path d="M78 100 L88 110 L110 88"
        stroke="#FFFFFF"
        stroke-width="6"
        fill="none"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>